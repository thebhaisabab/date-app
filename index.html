<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
--wine:#3b1f2b; --ink:#2b1b21; --blush:#fbf1ee; --paper:#fffaf8; --rose:#b76e79; --rose-d:#8f4a58;
--gold:#c9a86a; --line:#ecd9d4; --muted:#85696f;
--serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--blush);min-height:100vh;line-height:1.55;
background-image:radial-gradient(900px 400px at 85% -5%,#f6d9d6 0,transparent 70%),radial-gradient(700px 400px at -5% 30%,#f3e6d3 0,transparent 70%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:44px 0 26px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.6rem,7vw,4.2rem);line-height:1;color:var(--wine);letter-spacing:.01em}
h1 em{font-weight:400;color:var(--rose)}
.tag{color:var(--muted);margin-top:8px;font-size:.95rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rose);background:transparent;color:var(--rose-d);padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:400;transition:.2s}
.btn:hover{background:var(--rose);color:#fff}
.btn.solid{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.solid:hover{background:var(--rose-d);border-color:var(--rose-d)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.status{font-size:.82rem;color:var(--muted);margin-bottom:18px}
.status b{color:var(--rose-d);font-weight:500}

/* On this day */
.today{background:var(--wine);color:#f8e9e4;border-radius:22px;padding:26px 30px;margin-bottom:34px;position:relative;overflow:hidden}
.today::after{content:"♥";position:absolute;right:-14px;top:-40px;font-size:190px;color:#ffffff0d;line-height:1}
.today h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:1.7rem;color:var(--gold);margin-bottom:10px}
.today .item{padding:10px 0;border-top:1px solid #ffffff1f}
.today .item:first-of-type{border-top:0}
.today .item b{font-family:var(--serif);font-size:1.35rem;font-weight:600}
.today p{opacity:.85;margin-top:2px}
.soon{margin-top:12px;font-size:.9rem;opacity:.8}

h2.sec{font-family:var(--serif);font-weight:600;font-size:1.9rem;color:var(--wine);margin:8px 0 16px;display:flex;align-items:center;gap:14px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

/* Featured */
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-bottom:42px}
.fcard{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px;position:relative;box-shadow:0 18px 40px -26px #8f4a58aa}
.fcard::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold);border-radius:15px;opacity:.45;pointer-events:none}
.fcard .big{font-family:var(--serif);font-size:4.4rem;line-height:.9;color:var(--rose);font-weight:600}
.fcard .unit{font-style:italic;font-family:var(--serif);font-size:1.2rem;color:var(--muted)}
.fcard h3{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin:14px 0 2px;color:var(--wine);line-height:1.1}
.meta{color:var(--muted);font-size:.9rem}
.note{margin-top:10px;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:#5b4047}

/* List */
.month{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--rose-d);margin:22px 0 6px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.dt{text-align:center;font-family:var(--serif);line-height:1}
.dt b{display:block;font-size:2rem;color:var(--wine);font-weight:600}
.dt span{font-size:.95rem;color:var(--rose)}
.row h3{font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.15}
.row .note{margin-top:4px;font-size:1rem}
.right{text-align:right;white-space:nowrap}
.cd{font-family:var(--serif);font-size:1.15rem;color:var(--rose-d);font-weight:600}
.tools{display:flex;gap:4px;justify-content:flex-end;margin-top:2px}
.ic{background:none;border:0;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px;font-size:.85rem}
.ic:hover{color:var(--rose-d);background:var(--blush)}
.star{color:var(--gold)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-family:var(--serif);font-size:1.4rem;font-style:italic}

/* Dialog */
dialog{border:0;border-radius:22px;padding:30px;width:min(480px,92vw);background:var(--paper);box-shadow:0 30px 80px -20px #3b1f2b99;margin:auto}
dialog::backdrop{background:#3b1f2b88;backdrop-filter:blur(3px)}
dialog h2{font-family:var(--serif);font-size:1.9rem;color:var(--wine);margin-bottom:16px}
label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{resize:vertical;min-height:84px}
.chk{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--ink);font-size:1rem}
.chk input{accent-color:var(--rose);width:18px;height:18px}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.err{color:#b3261e;font-size:.9rem;margin-top:10px}
#login{max-width:380px;margin:12vh auto 0;text-align:center}
#login h1{font-size:3.2rem;margin-bottom:8px}
#login form{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:24px;text-align:left}
#login .btn{width:100%;margin-top:18px}
.hide{display:none!important}
@media(max-width:560px){.row{grid-template-columns:52px 1fr}.right{grid-column:1/-1;text-align:left;display:flex;justify-content:space-between;align-items:center}.today{padding:22px}}
@media(prefers-reduced-motion:no-preference){.fcard,.row{transition:transform .2s}.fcard:hover,.row:hover{transform:translateY(-2px)}}
</style>
</head>
<body>

<div id="login" class="hide">
<h1>Our <em>Days</em></h1>
<p class="tag">Sign in to open your shared calendar.</p>
<form id="loginForm">
<label for="em">Email</label><input id="em" type="email" required autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
<p class="err" id="loginErr"></p>
<button class="btn solid" type="submit">Sign in</button>
</form>
</div>

<div class="wrap hide" id="app">
<header>
<div>
<h1>Our <em>Days</em></h1>
<p class="tag" id="todayLabel"></p>
</div>
<div class="actions">
<button class="btn" id="notifyBtn">Turn on reminders</button>
<button class="btn" id="outBtn">Sign out</button>
<button class="btn solid" id="addBtn">Add a date</button>
</div>
</header>
<p class="status" id="status"></p>
<div id="todayBox"></div>
<div id="featBox"></div>
<div id="listBox"></div>
</div>

<dialog id="dlg">
<form id="form" method="dialog">
<h2 id="dlgTitle">Add a date</h2>
<label for="f-title">What is the occasion?</label>
<input id="f-title" type="text" required maxlength="60" placeholder="Our wedding day">
<label for="f-date">Date</label>
<input id="f-date" type="date" required>
<label for="f-type">Kind</label>
<select id="f-type">
<option value="anniversary">Anniversary</option>
<option value="birthday">Birthday</option>
<option value="milestone">Milestone</option>
<option value="memory">Special memory</option>
<option value="other">Other</option>
</select>
<label for="f-note">What happened on this day?</label>
<textarea id="f-note" maxlength="600" placeholder="Write the memory..."></textarea>
<label class="chk"><input type="checkbox" id="f-feat"> Feature this date at the top</label>
<div class="btns">
<button class="btn" type="button" id="cancelBtn">Cancel</button>
<button class="btn solid" type="submit">Save date</button>
</div>
</form>
</dialog>

<script type="module">
const FIREBASE_CONFIG = {
apiKey: "",
authDomain: "",
projectId: "",
appId: ""
};

const $ = function(id) { return document.getElementById(id); };
const cloud = Boolean(FIREBASE_CONFIG.apiKey);
var events = [], store = null, editing = null;

async function initStore(){
if(!cloud){
const load = function(){ return JSON.parse(localStorage.getItem("ourdays") || "[]"); };
const persist = function(list){ localStorage.setItem("ourdays", JSON.stringify(list)); };
let cb = null;
store = {
subscribe: function(f){ cb = f; cb(load()); },
save: async function(ev){
const l = load();
const i = l.findIndex(function(x){ return x.id === ev.id; });
if(i > -1) { l[i] = ev; } else { l.push(ev); }
persist(l); cb(l);
},
remove: async function(id){
const l = load().filter(function(x){ return x.id !== id; });
persist(l); cb(l);
}
};
$("status").innerHTML = "<b>Local mode.</b> Dates are saved only in this browser until you add your Firebase config.";
$("outBtn").classList.add("hide");
showApp();
store.subscribe(setEvents);
return;
}
const V = "10.12.2";
const base = "https://www.gstatic.com/firebasejs/" + V + "/";
const modApp = await import(base + "firebase-app.js");
const modAuth = await import(base + "firebase-auth.js");
const modDb = await import(base + "firebase-firestore.js");

const app = modApp.initializeApp(FIREBASE_CONFIG);
const auth = modAuth.getAuth(app);
const db = modDb.getFirestore(app);
const col = modDb.collection(db, "days");

store = {
subscribe: function(f){
return modDb.onSnapshot(col, function(s){
const list = s.docs.map(function(d){
return Object.assign({}, d.data(), {id: d.id});
});
f(list);
$("status").innerHTML = "<b>Synced</b> across your devices.";
}, function(e){
$("status").textContent = "Sync problem: " + e.message;
});
},
save: async function(ev){
const id = ev.id;
const data = Object.assign({}, ev);
delete data.id;
await modDb.setDoc(modDb.doc(db, "days", id), data);
},
remove: async function(id){
await modDb.deleteDoc(modDb.doc(db, "days", id));
}
};

$("outBtn").onclick = function(){ modAuth.signOut(auth); };
$("loginForm").onsubmit = async function(e){
e.preventDefault();
$("loginErr").textContent = "";
try {
await modAuth.signInWithEmailAndPassword(auth, $("em").value, $("pw").value);
} catch(err) {
$("loginErr").textContent = "Email or password doesn't match.";
}
};

let unsub = null;
modAuth.onAuthStateChanged(auth, function(u){
if(u){
$("login").classList.add("hide");
showApp();
unsub = store.subscribe(setEvents);
} else {
if(unsub) unsub();
$("app").classList.add("hide");
$("login").classList.remove("hide");
}
});
}

const showApp = function(){ $("app").classList.remove("hide"); };

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const startOfDay = function(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const parseDate = function(s){
const parts = s.split("-").map(Number);
return {y: parts[0], m: parts[1] - 1, d: parts[2]};
};
const TODAY = startOfDay(new Date());

function nextOcc(s){
const p = parseDate(s);
let t = new Date(TODAY.getFullYear(), p.m, p.d);
if(t < TODAY) { t = new Date(TODAY.getFullYear() + 1, p.m, p.d); }
return t;
}

const daysUntil = function(s){ return Math.round((nextOcc(s) - TODAY) / 86400000); };
const yearsAt = function(s){ return nextOcc(s).getFullYear() - parseDate(s).y; };
const ord = function(n){
return n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : ({1:"st", 2:"nd", 3:"rd"}[n % 10] || "th"));
};
const esc = function(s){
return String(s || "").replace(/[&<>"]/g, function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
});
};
const KIND = {anniversary:"Anniversary", birthday:"Birthday", milestone:"Milestone", memory:"Special memory", other:""};

function countdown(s){
const n = daysUntil(s);
if(n === 0) return "Today";
if(n === 1) return "Tomorrow";
return "in " + n + " days";
}

function setEvents(list){ events = list; render(); }

function render(){
$("todayLabel").textContent = TODAY.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
const sorted = [].concat(events).sort(function(a, b){ return daysUntil(a.date) - daysUntil(b.date); });

const same = sorted.filter(function(e){ return daysUntil(e.date) === 0; });
const soon = sorted.filter(function(e){
const n = daysUntil(e.date);
return n > 0 && n <= 7;
});

let t = "";
if(same.length > 0 || soon.length > 0){
t = '<section class="today">';
if(same.length > 0){
t += "<h2>On this day</h2>";
same.forEach(function(e){
const ago = TODAY.getFullYear() - parseDate(e.date).y;
t += '<div class="item"><b>' + esc(e.title) + '</b> <span class="meta" style="color:#f0c9c7">' + (ago > 0 ? ago + (ago === 1 ? " year ago" : " years ago") : "today") + "</span>";
if(e.note) { t += "<p>" + esc(e.note) + "</p>"; }
t += "</div>";
});
}
if(soon.length > 0){
t += '<p class="soon">' + (same.length > 0 ? "Coming up: " : '<b style="font-family:var(--serif);font-size:1.4rem;color:var(--gold)">Coming up this week</b><br>');
t += soon.map(function(e){ return esc(e.title) + " (" + countdown(e.date) + ")"; }).join(", ") + "</p>";
}
t += "</section>";
}
$("todayBox").innerHTML = t;

const feat = sorted.filter(function(e){ return e.featured; });
let featHtml = "";
if(feat.length > 0){
featHtml = '<h2 class="sec">Our favourite days</h2><div class="feat">';
feat.forEach(function(e){
const n = daysUntil(e.date);
const y = yearsAt(e.date);
const big = (n === 0 ? "♥" : n);
const unit = (n === 0 ? "Today" : (n === 1 ? "day to go" : "days to go"));
featHtml += '<article class="fcard"><div class="big">' + big + '</div><div class="unit">' + unit + '</div><h3>' + esc(e.title) + '</h3>';
featHtml += '<div class="meta">' + parseDate(e.date).d + " " + MONTHS[parseDate(e.date).m] + " " + parseDate(e.date).y + (y > 0 ? " · " + ord(y) + " " + (e.type === "birthday" ? "birthday" : "year") + " next" : "") + "</div>";
if(e.note){ featHtml += '<p class="note">' + esc(e.note) + "</p>"; }
featHtml += '<div class="tools"><button class="ic" data-edit="' + e.id + '">Edit</button><button class="ic" data-del="' + e.id + '">Delete</button></div></article>';
});
featHtml += "</div>";
}
$("featBox").innerHTML = featHtml;

if(events.length === 0){
$("listBox").innerHTML = '<div class="empty">Your story starts here.<br><span style="font-size:1rem;font-family:var(--sans);font-style:normal">Add your first special date to begin.</span></div>';
return;
}

let html = '<h2 class="sec">Every date we keep</h2>';
let cur = "";
sorted.forEach(function(e){
const o = nextOcc(e.date);
const key = MONTHS[o.getMonth()] + " " + o.getFullYear();
if(key !== cur){
html += '<div class="month">' + key + "</div>";
cur = key;
}
const p = parseDate(e.date);
html += '<div class="row"><div class="dt"><b>' + p.d + "</b><span>" + MONTHS[p.m].slice(0, 3) + "</span></div>";
html += '<div><h3>' + (e.featured ? '<span class="star" title="Featured">★</span> ' : '') + esc(e.title) + '</h3>';
html += '<div class="meta">' + [KIND[e.type], "since " + p.y].filter(Boolean).join(", ") + "</div>";
if(e.note) { html += '<p class="note">' + esc(e.note) + "</p>"; }
html += '</div><div class="right"><div class="cd">' + countdown(e.date) + '</div><div class="tools"><button class="ic" data-edit="' + e.id + '">Edit</button><button class="ic" data-del="' + e.id + '">Delete</button></div></div></div>';
});
$("listBox").innerHTML = html;
}

const dlg = $("dlg");
function openForm(ev){
editing = ev || null;
$("dlgTitle").textContent = ev ? "Edit this date" : "Add a date";
$("f-title").value = ev ? ev.title : "";
$("f-date").value = ev ? ev.date : "";
$("f-type").value = ev ? ev.type : "anniversary";
$("f-note").value = ev ? ev.note : "";
$("f-feat").checked = ev ? Boolean(ev.featured) : false;
dlg.showModal();
}

$("addBtn").onclick = function(){ openForm(null); };
$("cancelBtn").onclick = function(){ dlg.close(); };

$("form").onsubmit = async function(e){
e.preventDefault();
const ev = {
id: (editing && editing.id) ? editing.id : String(Date.now()),
title: $("f-title").value.trim(),
date: $("f-date").value,
type: $("f-type").value,
note: $("f-note").value.trim(),
featured: $("f-feat").checked
};
try {
await store.save(ev);
dlg.close();
} catch(err) {
alert("Could not save: " + err.message);
}
};

document.addEventListener("click", async function(e){
const ed = e.target.getAttribute("data-edit");
const del = e.target.getAttribute("data-del");
if(ed){
const item = events.find(function(x){ return x.id === ed; });
if(item) openForm(item);
}
if(del){
if(confirm("Delete this date? This removes it for both of you.")){
await store.remove(del);
}
}
});

function notifyNow(){
if(!("Notification" in window) || Notification.permission !== "granted") return;
events.forEach(function(e){
const n = daysUntil(e.date);
if(n <= 1){
const key = "n-" + e.id + "-" + TODAY.toDateString();
if(localStorage.getItem(key)) return;
localStorage.setItem(key, "1");
new Notification(n === 0 ? "Today: " + e.title : "Tomorrow: " + e.title, {body: e.note || "A day worth celebrating."});
}
});
}

$("notifyBtn").onclick = async function(){
if(!("Notification" in window)){ alert("This browser does not support notifications."); return; }
const p = await Notification.requestPermission();
$("notifyBtn").textContent = (p === "granted" ? "Reminders on" : "Reminders blocked");
notifyNow();
};

if("Notification" in window && Notification.permission === "granted") {
$("notifyBtn").textContent = "Reminders on";
}
window.addEventListener("load", function(){ setTimeout(notifyNow, 1500); });

initStore().catch(function(err){
document.body.insertAdjacentHTML("afterbegin", '<p class="err" style="padding:20px">Could not start: ' + esc(err.message) + '</p>');
});
</script>
</body>
</html>
