<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Our Days</title>
<style>
body { font-family: sans-serif; background: #fbf1ee; color: #2b1b21; padding: 40px; text-align: center; }
.box { background: #fffaf8; padding: 30px; border-radius: 16px; max-width: 500px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
button { background: #3b1f2b; color: white; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
<h1>Our Days</h1>
<p>Local Mode Test</p>
<input type="text" id="t" placeholder="Occasion title (e.g. Our Anniversary)">
<input type="date" id="d">
<button onclick="saveDate()">Save Date</button>
<ul id="list" style="list-style:none; padding:0; margin-top:20px; text-align:left;"></ul>
</div>
<script>
function loadDates() {
var items = JSON.parse(localStorage.getItem("dates") || "[]");
var html = "";
for(var i=0; i<items.length; i++) {
html += "<li style='padding:8px 0; border-bottom:1px solid #eee;'><b>" + items[i].title + "</b> - " + items[i].date + "</li>";
}
document.getElementById("list").innerHTML = html;
}
function saveDate() {
var title = document.getElementById("t").value;
var date = document.getElementById("d").value;
if(!title || !date) { alert("Please fill in both fields"); return; }
var items = JSON.parse(localStorage.getItem("dates") || "[]");
items.push({title: title, date: date});
localStorage.setItem("dates", JSON.stringify(items));
document.getElementById("t").value = "";
document.getElementById("d").value = "";
loadDates();
}
loadDates();
</script>
</body>
</html>
